<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MealMatch – Stock</title>
<link rel="stylesheet" href="../layout.css">
<link rel="stylesheet" href="inventory.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-shell">

  <!-- TOPBAR -->
  <header class="topbar">
    <a href="../mainmenu.html" class="topbar-back">
      <i class="fas fa-chevron-left"></i>
    </a>
    <div class="topbar-center">
      <span class="topbar-title">Stock</span>
      <span class="topbar-sub" id="stockSub">0 items · sorted by expiry</span>
    </div>
    <a href="../myfridge/myfridge.html" class="topbar-action">
      <i class="fas fa-snowflake"></i>
    </a>
  </header>

  <!-- SEARCH -->
  <div class="search-wrap">
    <div class="search-box">
      <i class="fas fa-magnifying-glass"></i>
      <input type="text" id="searchInput"
             placeholder="Search ingredient..." oninput="filterItems()">
    </div>
  </div>

  <!-- FILTER TABS -->
  <div class="filter-tabs">
    <button class="ftab active" data-filter="all"     onclick="setFilter('all')">
      All <span class="ftab-count" id="cntAll">0</span>
    </button>
    <button class="ftab fresh"   data-filter="fresh"   onclick="setFilter('fresh')">
      <span class="ftab-dot fresh"></span> Fresh
      <span class="ftab-count" id="cntFresh">0</span>
    </button>
    <button class="ftab soon"    data-filter="soon"    onclick="setFilter('soon')">
      <span class="ftab-dot soon"></span> Soon
      <span class="ftab-count" id="cntSoon">0</span>
    </button>
    <button class="ftab expired" data-filter="expired" onclick="setFilter('expired')">
      <span class="ftab-dot expired"></span> Expired
      <span class="ftab-count" id="cntExpired">0</span>
    </button>
  </div>

  <!-- LIST -->
  <main class="page-body">
    <div id="inventoryList"></div>
    <div style="height:90px"></div>
  </main>

  <!-- BOTTOM NAV -->
  <nav class="bnav">
    <a href="../mainmenu.html"         class="bnav-item"><i class="fas fa-house"></i><span>Home</span></a>
    <a href="../myfridge/myfridge.html"         class="bnav-item"><i class="fas fa-snowflake"></i><span>Fridge</span></a>
    <a href="../menumatching/menumatching.html" class="bnav-item"><i class="fas fa-utensils"></i><span>Match</span></a>
    <a href="../shoplist/shoplist.html"         class="bnav-item"><i class="fas fa-cart-shopping"></i><span>Shopping</span></a>
    <a href="../mainmenu/more.html"              class="bnav-item"><i class="fas fa-ellipsis"></i><span>More</span></a>
  </nav>

</div>

<!-- ITEM MODAL (bottom sheet) -->
<div class="modal-overlay" id="itemModal">
  <div class="modal-box item-popup">
    <button class="modal-close" onclick="closeItemModal()">
      <i class="fas fa-xmark"></i>
    </button>
    <div id="popupIcon" class="popup-img"></div>
    <h3 id="popupName" class="popup-name"></h3>
    <div class="qty-control">
      <button class="qty-btn" onclick="adjustQty(-1)"><i class="fas fa-minus"></i></button>
      <div class="qty-display">
        <input type="number" id="popupQty">
        <span id="popupUnit"></span>
      </div>
      <button class="qty-btn" onclick="adjustQty(1)"><i class="fas fa-plus"></i></button>
    </div>

    <div class="popup-expire-row">
      <label class="popup-expire-label">
        <i class="fas fa-calendar"></i> Expiry date
      </label>
      <input type="date" id="popupExpire" class="popup-expire-input">
    </div>

    <button class="save-btn" onclick="saveItem()">
      <i class="fas fa-check"></i> Save changes
    </button>

    <button class="delete-btn" onclick="deleteItem()">
      <i class="fas fa-trash"></i> Remove item
    </button>
  </div>
</div>

<script type="module" src="inventory.js"></script>
</body>
</html>
